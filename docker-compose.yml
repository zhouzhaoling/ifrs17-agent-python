

services:
  ifrs17-agent-python:
    build: .
    container_name: ifrs17-agent-python-app
    ports:
      - "8000:8000"
    environment:
      # 👈 告诉容器，去找宿主机的 Ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    extra_hosts:
      # 👈 必须加这个，才能让容器访问外部网络
      - "host.docker.internal:host-gateway"