<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>IFRS17 Agent 流式测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f9; }
        #chat-box { width: 100%; max-width: 800px; height: 400px; background: white; border: 1px solid #ccc; padding: 10px; overflow-y: auto; margin-bottom: 20px; white-space: pre-wrap; }
        #input-box { width: 80%; padding: 10px; }
        #send-btn { padding: 10px 20px; }
    </style>
</head>
<body>
    <h2>IFRS17 智能分析 Agent (SSE 流式测试)</h2>
    <div id="chat-box"></div>
    <input type="text" id="input-box" value="上海机构准备金为什么对不上" placeholder="输入你的问题...">
    <button id="send-btn" onclick="startChat()">发送</button>

    <script>
        function startChat() {
            const question = document.getElementById('input-box').value;
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML = "思考中...\n\n";
            
            // 建立 SSE 连接
            const eventSource = new EventSource(`http://127.0.0.1:8000/api/agent/chat/stream?question=${encodeURIComponent(question)}`);

            // 每次收到服务器发来的数据，就会触发这个方法
            eventSource.onmessage = function(event) {
                if (event.data === "[DONE]") {
                    eventSource.close();
                    return;
                }
                try {
                    const data = JSON.parse(event.data);
                    if (data.status) {
                        chatBox.innerHTML += `[系统提示] ${data.status}\n`;
                    }
                    if (data.text) {
                        // 像打字机一样追加文字
                        chatBox.innerHTML += data.text;
                    }
                    chatBox.scrollTop = chatBox.scrollHeight; // 自动滚到底部
                } catch (e) {
                    console.error("解析失败", e);
                }
            };

            eventSource.onerror = function() {
                chatBox.innerHTML += "\n[连接断开]";
                eventSource.close();
            };
        }
    </script>
</body>
</html>
